[app]
name = "my-streamnzb"
primary_region = "lhr"

[build]
image = "ghcr.io/gaisberg/streamnzb:latest"

[env]
TZ = "Europe/London"

# Uncomment and set these to pre-configure on first run:
# SECURITY_TOKEN = "changeme"
# NZBHYDRA2_URL = ""         # leave blank, using Prowlarr instead
# PROWLARR_URL = "https://my-prowlarr.fly.dev"
# PROWLARR_API_KEY = ""      # fill in after Prowlarr is running

[[services]]
internal_port = 7000
protocol = "tcp"

[[services.ports]]
port = 80
handlers = ["http"]

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[[services]]
internal_port = 1119
protocol = "tcp"

[[services.ports]]
port = 1119

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1

[mounts]
source = "streamnzb_data"
destination = "/app/data"
